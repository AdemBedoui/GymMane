# Builds an unsigned GymMane .ipa on GitHub's Mac servers.
# Sign and install the .ipa with Sideloadly.
name: Build iOS (unsigned)

on:
  push:
    branches: [ios-build]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare the iOS project
        run: tool/ios_prepare.sh
      - name: Build the app without signing
        run: flutter build ios --release --no-codesign
      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry GymMane-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GymMane-unsigned-ipa
          path: GymMane-unsigned.ipa
          retention-days: 14
